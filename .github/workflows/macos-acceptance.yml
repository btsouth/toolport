name: macOS acceptance

# On-demand check of a published release on clean Apple Silicon runners, done
# the way a new Mac user would: download, Gatekeeper, first launch, keychain,
# client setup, upgrade, Homebrew and uninstall. The window is driven through
# macOS accessibility. Evidence (screenshots, logs, leftover files, crash
# reports) is uploaded as artifacts; each job summary lists every check and
# everything the runner could not test.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to test (empty: the latest release)"
        required: false
        type: string
        default: ""
      build_ref:
        description: "Instead of a release, build the app from this ref (unsigned; keychain checks are skipped)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-acceptance-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  TAG_INPUT: ${{ inputs.tag }}

jobs:
  new-user:
    name: New user (dmg)
    if: ${{ !inputs.build_ref }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve the release under test
        run: bash scripts/macos-acceptance/resolve-release.sh "$TAG_INPUT" | sed 's/^tag=/TAG=/; s/^previous=/PREVIOUS_TAG=/' >>"$GITHUB_ENV"
      - name: Prepare the runner and seed client configs
        run: bash scripts/macos-acceptance/prepare.sh
      - name: Install the Apple Silicon dmg
        run: bash scripts/macos-acceptance/install-dmg.sh "$TAG" Toolport_aarch64-apple-darwin.dmg
      - name: Check the installed bundle
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/bundle-checks.sh /Applications/Toolport.app arm64 "Apple Silicon"
      - name: Check the Intel dmg
        if: ${{ !cancelled() }}
        run: |
          bash scripts/macos-acceptance/install-dmg.sh "$TAG" Toolport_x86_64-apple-darwin.dmg --no-install
          bash scripts/macos-acceptance/bundle-checks.sh "$RUNNER_TEMP/inspect/Toolport_x86_64-apple-darwin.dmg/Toolport.app" x86_64 Intel
      - name: First launch
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/first-run.sh new
      - name: Set up through the window (servers, keychain, clients, tool calls)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash scripts/macos-acceptance/ui-setup.sh new "$CLIENT_MANIFEST"
      - name: Second launch
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash scripts/macos-acceptance/relaunch.sh new
      - name: Uninstall (Settings, remove data, Trash)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/uninstall.sh new "$CLIENT_MANIFEST" ui --remove-data
      - name: List leftovers
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/leftovers.sh "uninstall, data removed" --expect-clean
      - name: Write the job summary
        if: always()
        run: bash scripts/macos-acceptance/finish.sh "New user (dmg) ${TAG:-}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-acceptance-new-user
          path: ${{ runner.temp }}/macos-acceptance
          if-no-files-found: error
          retention-days: 14

  upgrade:
    name: Upgrade from the previous release (dmg)
    if: ${{ !inputs.build_ref }}
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve the release under test
        run: bash scripts/macos-acceptance/resolve-release.sh "$TAG_INPUT" | sed 's/^tag=/TAG=/; s/^previous=/PREVIOUS_TAG=/' >>"$GITHUB_ENV"
      - name: Prepare the runner and seed client configs
        run: bash scripts/macos-acceptance/prepare.sh
      - name: Install the previous release
        run: |
          test -n "$PREVIOUS_TAG" || { echo "::error::no published release before $TAG"; exit 1; }
          bash scripts/macos-acceptance/install-dmg.sh "$PREVIOUS_TAG" Toolport_aarch64-apple-darwin.dmg
      - name: First launch of the previous release
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/first-run.sh previous
      - name: Set up the previous release through the window
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash scripts/macos-acceptance/ui-setup.sh previous "$CLIENT_MANIFEST"
      - name: Upgrade to the release under test
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: bash scripts/macos-acceptance/upgrade.sh "$TAG" "$CLIENT_MANIFEST"
      - name: Uninstall with the CLI (data kept)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/uninstall.sh upgraded "$CLIENT_MANIFEST" cli
      - name: List leftovers
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/leftovers.sh "uninstall, data kept"
      - name: Write the job summary
        if: always()
        run: bash scripts/macos-acceptance/finish.sh "Upgrade ${PREVIOUS_TAG:-} to ${TAG:-}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-acceptance-upgrade
          path: ${{ runner.temp }}/macos-acceptance
          if-no-files-found: error
          retention-days: 14

  homebrew:
    name: Homebrew cask
    if: ${{ !inputs.build_ref }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve the release under test
        run: bash scripts/macos-acceptance/resolve-release.sh "$TAG_INPUT" | sed 's/^tag=/TAG=/; s/^previous=/PREVIOUS_TAG=/' >>"$GITHUB_ENV"
      - name: Prepare the runner and seed client configs
        run: bash scripts/macos-acceptance/prepare.sh
      - name: Install with Homebrew
        run: bash scripts/macos-acceptance/homebrew.sh install "$TAG"
      - name: Check the installed bundle
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/bundle-checks.sh /Applications/Toolport.app arm64 Homebrew
      - name: First launch
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/first-run.sh brew
      - name: Set up through the window
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash scripts/macos-acceptance/ui-setup.sh brew "$CLIENT_MANIFEST"
      - name: Uninstall with Homebrew (zap)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/homebrew.sh uninstall
      - name: List leftovers
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/leftovers.sh "brew uninstall --zap"
      - name: Write the job summary
        if: always()
        run: bash scripts/macos-acceptance/finish.sh "Homebrew ${TAG:-}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-acceptance-homebrew
          path: ${{ runner.temp }}/macos-acceptance
          if-no-files-found: error
          retention-days: 14

  current-ref:
    name: Build from this ref (unsigned)
    if: ${{ inputs.build_ref }}
    runs-on: macos-latest
    timeout-minutes: 90
    # Same CI-only release-profile overrides as ci.yml's macOS payload job.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      SIGNED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: macos-payload
          cache-bin: "false"
          save-if: "false"
      - run: npm ci
      - name: Build the app without release signing or publishing
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles app -- --bin conduit
      - name: Prepare the runner and seed client configs
        run: bash scripts/macos-acceptance/prepare.sh
      - name: Install the built app
        run: |
          ditto src-tauri/target/release/bundle/macos/Toolport.app /Applications/Toolport.app
          printf 'install\tINFO\tbuilt from\t%s\n' "$GITHUB_SHA" >>"$EVIDENCE/results.tsv"
      - name: Check the installed bundle
        run: bash scripts/macos-acceptance/bundle-checks.sh /Applications/Toolport.app arm64 "current ref"
      - name: First launch
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: bash scripts/macos-acceptance/first-run.sh ref
      - name: Set up through the window
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash scripts/macos-acceptance/ui-setup.sh ref "$CLIENT_MANIFEST"
      - name: Second launch
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash scripts/macos-acceptance/relaunch.sh ref
      - name: Uninstall (Settings, then Trash)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: bash scripts/macos-acceptance/uninstall.sh ref "$CLIENT_MANIFEST" ui
      - name: List leftovers
        if: ${{ !cancelled() }}
        run: bash scripts/macos-acceptance/leftovers.sh "uninstall, data kept"
      - name: Write the job summary
        if: always()
        run: bash scripts/macos-acceptance/finish.sh "Current ref (unsigned) ${GITHUB_SHA}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-acceptance-current-ref
          path: ${{ runner.temp }}/macos-acceptance
          if-no-files-found: error
          retention-days: 14
