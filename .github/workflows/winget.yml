name: winget

# Retry publication independently of builds and release asset uploads.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release tag to submit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  submit:
    timeout-minutes: 20
    if: ${{ (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease) && !contains(github.event.release.tag_name || inputs.tag, '-') }}
    runs-on: ubuntu-24.04
    env:
      WINGET_CONFIGURED: ${{ secrets.WINGET_TOKEN != '' }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate release and submit or resume manifest PR
        if: ${{ env.WINGET_CONFIGURED == 'true' }}
        run: node .github/scripts/winget.mjs
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Say why nothing was submitted
        if: ${{ env.WINGET_CONFIGURED != 'true' }}
        run: echo "::warning::WINGET_TOKEN is not set; no winget manifest was submitted."
