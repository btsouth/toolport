name: Arch repository

# Builds the native GTK package from a published tag and publishes it to the
# Toolport pacman repository on Cloudflare R2, so Arch users get updates through
# `pacman -Syu` like everything else on their system.
#
# Manual dispatch, not tag-triggered: the PKGBUILD's sha256 is computed from the
# tag tarball AFTER the tag exists, so a tag push alone cannot be trusted to have
# a matching PKGBUILD committed yet. Run this once the release is published.
#
# The build container REPORTS, it does not sign. Signing and upload happen on the
# runner in later, separately-scoped steps, so code from a mutable `archlinux`
# image tag never sees the signing key or the R2 credentials.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to package, e.g. v1.18.0"
        required: true
      dry_run:
        description: "Build and validate only; do not publish to R2"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arch-repo
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to the pacman repo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check the tag is publishable
        run: |
          # A dry run only needs the git tag: it builds from the tarball that tag
          # produces and publishes nothing, so it deliberately does not consult
          # the release API at all. GITHUB_TOKEN cannot see draft releases, and
          # validating before publishing is the whole point of a dry run.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1 || {
              echo "::error::$TAG is not a tag in this repository."; exit 1; }
            echo "dry run: building from tag $TAG, publishing nothing"
            exit 0
          fi
          # A real publish must correspond to a release users can actually see.
          state="$(gh release view "$TAG" --json isDraft,isPrerelease 2>/dev/null)" || {
            echo "::error::$TAG has no published GitHub release. Publish it first."; exit 1; }
          [ "$(echo "$state" | jq -r .isDraft)" = "false" ] || {
            echo "::error::$TAG is still a draft. Publish it, or re-run with dry_run to validate only."; exit 1; }
          [ "$(echo "$state" | jq -r .isPrerelease)" = "false" ] || {
            echo "::error::$TAG is a prerelease; the pacman repo is stable-only."; exit 1; }

      # The committed PKGBUILD is the single source of truth for what gets built.
      # If it does not describe this tag, something was not updated at release
      # time and building anyway would publish a package that claims a version it
      # is not. Fail loudly instead.
      - name: Check the PKGBUILD matches the tag
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^pkgver=//p' packaging/linux/native/PKGBUILD)"
          if [ "$want" != "$have" ]; then
            echo "::error::PKGBUILD pkgver is $have but the tag is $want. Bump it and re-run updpkgsums."
            exit 1
          fi
          if grep -q "sha256sums=('SKIP')" packaging/linux/native/PKGBUILD; then
            echo "::error::PKGBUILD still has sha256sums=('SKIP'). Run updpkgsums against the tag."
            exit 1
          fi

      # A real chroot-equivalent build. Dependencies are installed rather than
      # skipped: the shell LINKS against gtk4 and libadwaita, so they are build
      # requirements, not just runtime ones, and cargo comes from makedepends.
      - name: Build the package in an Arch container
        run: |
          mkdir -p pkgout
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/pkgout:/out" \
            -w /build archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed archlinux-keyring namcap git > /dev/null
            useradd -m builder
            # makepkg --syncdeps shells out to `sudo pacman`, and builder has no
            # sudoers entry in the base image, so dependency installation fails
            # with a bare "could not resolve all dependencies".
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chmod 440 /etc/sudoers.d/builder
            cp /src/packaging/linux/native/PKGBUILD /build/
            chown -R builder /build /out
            sudo -u builder makepkg --noconfirm --nocheck --syncdeps
            namcap PKGBUILD || true
            pkg=$(ls -1 *.pkg.tar.zst | grep -v -- "-debug-" | head -1)
            echo "built $pkg"
            namcap "$pkg" || true
            bsdtar -tf "$pkg" | tee contents.txt
            unexpected=$(grep -E "^usr/bin/" contents.txt | grep -Ev "^usr/bin/(toolport-gtk|toolport-gateway)$" || true)
            test -z "$unexpected" || { echo "::error::Unexpected binaries: $unexpected"; exit 1; }
            for want in usr/bin/toolport-gtk usr/bin/toolport-gateway; do
              grep -qx "$want" contents.txt || { echo "::error::$want missing from $pkg"; exit 1; }
            done
            grep -q "^usr/share/applications/com.tsout.Toolport.desktop$" contents.txt \
              || { echo "::error::desktop entry missing from $pkg"; exit 1; }
            cp *.pkg.tar.zst /out/
          '
          # The container chowns the mount to its own build user, so the runner
          # loses write access to it and later steps cannot drop signatures
          # alongside the packages.
          sudo chown -R "$(id -u):$(id -g)" pkgout
          ls -la pkgout

      - name: Sign the package
        if: ${{ !inputs.dry_run }}
        env:
          # Step-scoped on purpose: the build step above runs code from a mutable
          # image tag and has no business being able to read this key.
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::REPO_GPG_PRIVATE_KEY is not set. Add it before publishing."; exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # repo-add shells out to gpg itself, so make the whole agent
          # non-interactive rather than relying on flags we do not control.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'batch\npinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          # Refuse to sign with anything other than the fingerprint the installer
          # pins, so a wrong key in the secret cannot silently produce a repo no
          # client will trust.
          expected="A16BFA2E1014BD6BD718CC6E6621247E3FFA6AA7"
          got="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          if [ "$got" != "$expected" ]; then
            echo "::error::REPO_GPG_PRIVATE_KEY is $got but install.sh pins $expected."
            exit 1
          fi
          echo "signing with $keyid"
          for p in pkgout/*.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$keyid" --detach-sign --no-armor "$p"
          done
          ls -la pkgout

      # Fetch the existing database so older versions stay installable, add the
      # new package to it, and push the whole set back. repo-add on a fresh db
      # each run would silently drop every prior version.
      - name: Rebuild the repository database
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://$R2_BUCKET/x86_64/" pkgout/ --recursive \
            --endpoint-url "$endpoint" --exclude "*" \
            --include "toolport.db*" --include "toolport.files*" || true
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          # repo-add ships with pacman, which the Ubuntu runner does not have, so
          # the database is assembled inside the same Arch image the package was
          # built in. It runs as the runner's uid so the outputs stay writable
          # here. Deliberately NOT `repo-add --sign`: that would mean mounting
          # GNUPGHOME into a container running code from a mutable image tag.
          # The database is signed below, on the runner, like the packages.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/pkgout:/repo" \
            -w /repo archlinux:base \
            bash -c 'repo-add toolport.db.tar.gz *.pkg.tar.zst'
          # pacman fetches `toolport.db` and verifies `toolport.db.sig`, so each
          # database needs a detached signature under the name clients request.
          cd pkgout
          for db in toolport.db.tar.gz toolport.files.tar.gz; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$keyid" --detach-sign --no-armor "$db"
            ln -sf "$db.sig" "${db%.tar.gz}.sig"
          done
          ls -la

      - name: Publish to R2
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Packages first, database last: a client that syncs mid-upload then
          # sees the old database, which points only at files already present,
          # rather than a new database naming a package that has not landed.
          aws s3 sync pkgout/ "s3://$R2_BUCKET/x86_64/" \
            --endpoint-url "$endpoint" --exclude "toolport.db*" --exclude "toolport.files*"
          aws s3 sync pkgout/ "s3://$R2_BUCKET/x86_64/" \
            --endpoint-url "$endpoint" --exclude "*" \
            --include "toolport.db*" --include "toolport.files*"
          # The public key is published from the copy versioned in this repo, so
          # what install.sh imports is always the file reviewers can diff, and it
          # cannot drift from a hand-uploaded object.
          aws s3 cp packaging/linux/native/toolport.gpg "s3://$R2_BUCKET/toolport.gpg" \
            --endpoint-url "$endpoint" --content-type application/pgp-keys
          echo "published $TAG to the pacman repo"

      - name: Summary
        run: |
          {
            echo "### Arch repository"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: built and validated \`$TAG\`, published nothing."
            else
              echo "Published \`$TAG\`. Users on the repo get it with their next \`pacman -Syu\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
