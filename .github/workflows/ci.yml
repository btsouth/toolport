name: CI

on:
  # Drafts run the Linux checks only (see ci-policy.mjs fullRun). Marking a PR
  # ready for review starts the full run; so does every later push to it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, next/2.0]
  workflow_dispatch:

# A new push to a PR cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (checkout, build, test). No writes.
permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS bundle validation
    # macOS and Windows runners are the scarce ones: start only after the cheap
    # Linux gates pass, and never for a draft PR.
    needs: [changes, frontend, clippy, rustfmt]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.installers == 'true' && needs.frontend.result == 'success' &&
      (needs.changes.outputs.rust == 'false' ||
      (needs.clippy.result == 'success' && needs.rustfmt.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    # CI-only release-profile overrides reach both Tauri and prepare-sidecar.
    # Keep release assertions, bundling, signing and artifact paths unchanged.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Use real bundle settings; installers stay in CI and are not published.
      - name: Set the numeric MSI version for CI previews
        run: node .github/scripts/ci-msi-config.mjs
        env:
          CI_UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      - name: Build the real NSIS and MSI installers
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.ci-msi.conf.json --bundles nsis,msi -- --bin conduit
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check shipped contents
        shell: bash
        run: node .github/scripts/package-contents.mjs src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi
      - name: Exercise the real installer and uninstaller
        shell: pwsh
        run: python scripts/test-windows-installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-nsis-validation
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe*
            src-tauri/target/release/bundle/msi/*.msi*
            .verify/windows-installer/**
          if-no-files-found: error
          retention-days: 7

  macos-payload:
    name: macOS app payload validation
    # macOS and Windows runners are the scarce ones: start only after the cheap
    # Linux gates pass, and never for a draft PR.
    needs: [changes, frontend, clippy, rustfmt]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.full == 'true' &&
      needs.changes.outputs.installers == 'true' && needs.frontend.result == 'success' &&
      (needs.changes.outputs.rust == 'false' ||
      (needs.clippy.result == 'success' && needs.rustfmt.result == 'success')) }}
    runs-on: macos-latest
    timeout-minutes: 90
    # CI-only release-profile overrides reach both Tauri and prepare-sidecar.
    # Keep release assertions, bundling, signing and artifact paths unchanged.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Real Homebrew against packaging/homebrew/toolport.rb with a stub app:
      # reinstall and upgrade must not touch clients, uninstall and zap must.
      # Runs on the newest Homebrew each build, since the cask tells an upgrade
      # from an uninstall by Homebrew's own call stack and command line.
      - name: Homebrew cask lifecycle (reinstall, upgrade, uninstall, zap)
        run: |
          brew update --quiet
          bash scripts/test-homebrew-cask-lifecycle.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: macos-payload
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build the app without release signing or publishing
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles app -- --bin conduit
      - name: Check every app bundle file
        run: node .github/scripts/package-contents.mjs src-tauri/target/release/bundle/macos/*.app
      # The release dmg builder, unsigned: Toolport.app beside an Applications
      # shortcut over the drag-to-install background.
      - name: Build the drag-to-install dmg
        run: |
          bash scripts/macos-build-dmg.sh src-tauri/target/release/bundle/macos/Toolport.app "$RUNNER_TEMP/Toolport.dmg"
          mount="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$RUNNER_TEMP/Toolport.dmg"
          ls -la "$mount"
          test -f "$mount/.background/background.tiff"
          test -f "$mount/.DS_Store" || echo "::warning::Finder layout was not written; the dmg still has its Applications shortcut"
          hdiutil detach "$mount" || { sleep 5; hdiutil detach "$mount" -force; }
      # The same manifest check the release runs on the shipped dmg, so volume
      # metadata or a stray file fails here instead of on a tag.
      - name: Check every dmg file
        run: node .github/scripts/package-contents.mjs "$RUNNER_TEMP/Toolport.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-payload
          path: |
            src-tauri/target/release/bundle/macos/*.app
            ${{ runner.temp }}/Toolport.dmg
          if-no-files-found: error
          retention-days: 7

  linux-appimage:
    name: Linux AppImage validation
    needs: changes
    if: needs.changes.outputs.installers == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Same CI-only overrides as the Windows and macOS installer jobs. The patch
    # script and payload assertion are the ones the release runs, so a Tauri or
    # linuxdeploy change that breaks them fails on the PR instead of on a tag.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev squashfs-tools
      - name: Give the runner headroom (the app crate links WebKitGTK)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo fallocate -l 8G /mnt/ci-swap && sudo chmod 600 /mnt/ci-swap && sudo mkswap /mnt/ci-swap && sudo swapon /mnt/ci-swap || true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: linux-appimage
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build the AppImage without release signing or publishing
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles appimage -- --bin conduit
      - name: Unbundle wayland and make the X11 backend overridable
        shell: bash
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#images[@]} -ne 1 ]; then
            echo "::error::expected exactly one AppImage, found ${#images[@]}"
            exit 1
          fi
          bash scripts/patch-appimage.sh "${images[0]}"
      - name: Check every AppImage file
        run: node .github/scripts/package-contents.mjs src-tauri/target/release/bundle/appimage/*.AppImage

  linux-packages:
    name: GTK deb and rpm install tests
    needs: changes
    if: needs.changes.outputs.linux_packages == 'true'
    uses: ./.github/workflows/linux-packages.yml

  changes:
    name: Select checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      linux_packages: ${{ steps.select.outputs.linux_packages }}
      installers: ${{ steps.select.outputs.installers }}
      full: ${{ steps.select.outputs.full }}
      headless_matrix: ${{ steps.select.outputs.headless_matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test check selection and required gate
        run: node --test .github/scripts/ci-policy.test.mjs .github/scripts/gateway-build-features.test.mjs .github/scripts/check-guard.test.mjs
      - name: Test macOS acceptance helpers
        run: |
          python3 -B scripts/macos-acceptance/test_render_summary.py
          python3 -B scripts/macos-acceptance/test_clients.py
          python3 -B scripts/macos-acceptance/test_finder_targets.py
          python3 -B scripts/macos-acceptance/test_windows_query.py
          python3 -B scripts/macos-acceptance/test_layout_check.py
          node --test scripts/macos-acceptance/mcp-call.test.mjs
      - name: Select changed native checks
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/scripts/ci-policy.mjs select

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Release publication and payload fixtures
        run: node --test .github/scripts/release-hygiene.test.mjs

      - name: Production dependency audit
        run: npm run audit:prod

      # Enforce consistent formatting before anything else — fails fast on
      # formatting-only issues so the contributor doesn't wait for a full build.
      - name: Check formatting
        run: npm run format:check

      - name: Check localization catalogs and source coverage
        run: npm run check:locales

      - name: Lint
        run: npm run lint

      # Frontend type-check + build (`build` is `tsc && vite build`). Also produces
      # dist/, which tauri-build expects when compiling the Rust crate below.
      - name: Frontend type-check + build
        run: npm run build

      - name: Frontend tests
        run: npm run test

      - name: Startup bundle budget
        run: npm run bench:bundle

      - name: Install browser for offline UI smoke
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Offline browser fixture smoke
        run: npm run smoke:browser

      - name: Localization fixture smoke
        run: npm run smoke:localization

      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-diagnostics
          path: |
            .verify/browser-*/
            .verify/localization-*/
          include-hidden-files: true
          if-no-files-found: ignore

  linux-native:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Linux-native GTK preview
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # The native shell deliberately skips WebKit/Tauri. Ubuntu 24.04 provides
      # GTK >= 4.10 and libadwaita >= 1.4, the floor for adaptive navigation.
      - name: Install GTK build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential libssl-dev pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus-daemon xdotool

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-gtk
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}
      - name: Build the native GTK shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features gtk-desktop --bin toolport-gtk

      - name: Test the native shell module
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          --features gtk-desktop --lib linux_native::

      - name: Test GTK dialogs and menus in isolated processes
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          # The credential reprobe test starts this mock; it looks for it in the
          # Cargo target folder above its own test binary.
          cargo build --manifest-path src-tauri/Cargo.toml --no-default-features \
            --features gtk-desktop,test-support --bin mock-mcp-server
          for case in \
            catalog::tests::escape_closes_the_suggestions_and_then_clears_the_search \
            teams::tests::member_review_native_shows_diff_labels_and_both_decisions \
            teams::tests::member_review_native_keeps_remaining_decisions_open \
            teams::tests::share_preview_explains_each_selection_and_its_route \
            tests::editor_validation_clears_feedback_and_keeps_test_result_outside_scroll \
            tests::a_refused_paste_leaves_the_form_and_shows_only_the_refusal \
            tests::closed_server_editors_are_freed \
            teams::tests::share_preview_widgets_show_allowlisted_definitions \
            quiet_tooltips::tests::a_guarded_menu_silences_tooltips_before_it_is_presented \
            quiet_tooltips::tests::dropdowns_split_buttons_and_popovers_silence_tooltips_while_open \
            tests::pasted_rows_are_freed_when_the_dialog_closes \
            tests::pasted_arguments_survive_the_gtk_box \
            tests::server_rows_keep_their_name_and_status_text_in_a_narrow_window \
            tests::server_status_chips_keep_whole_words_on_one_line_in_narrow_windows \
            settings::tests::endpoint_action_style_tracks_status_and_live_language \
            tests::client_access_menu_stays_on_one_line_in_every_language \
            tests::a_connected_row_with_a_migration_fits_a_narrow_window_in_every_language \
            tests::pasted_rows_offer_the_react_choices \
            credential_dialog_tests::credentials_dialog_waits_for_values_and_stays_open_after_each_write \
            credential_dialog_tests::authentication_dialog_confirms_removals_and_keeps_focus_and_caption \
            credential_dialog_tests::a_locked_keyring_asks_once_per_click_and_unknown_is_not_absent \
            credential_dialog_tests::a_reference_saved_from_add_updates_a_launch_input_row \
            credential_dialog_tests::remove_client_credentials_shows_when_the_secret_is_unknown \
            tests::connect_shows_reacts_restart_reminder \
            details::tests::b5_credential_save_reprobes_unchanged_detail_without_refresh \
            setup::tests::review_list_caps_at_parent_height_and_keeps_footer_visible \
            setup::tests::import_review_shows_saved_names_and_marks_unsupported_for_review \
            setup::tests::review_rows_show_markup_characters_as_text \
            setup_import_share_tests::import_selection_count_tracks_zero_one_and_many \
            setup_import_share_tests::setup_import_review_names_checks_follows_toggles_and_clears_progress \
            setup_import_share_tests::client_import_review_clears_the_scan_line \
            setup_import_share_tests::paste_import_starts_in_the_editor_and_needs_text \
            setup_import_share_tests::share_actions_stay_pinned_and_need_a_server \
            setup_import_share_tests::setup_file_dialogs_start_in_downloads_and_list_setups_first \
            setup::tests::successful_review_shows_restart_and_only_done \
            setup::tests::a_review_closed_while_connecting_only_refreshes
          do
            xvfb-run -a dbus-run-session -- cargo test \
              --manifest-path src-tauri/Cargo.toml --no-default-features \
              --features gtk-desktop --lib "linux_native::$case" \
              -- --exact --ignored
          done

  rustfmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust changed-line formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt
      # A changed-line check avoids rewriting legacy files or following modules.
      # Bump with Clippy after reviewing the resulting formatting and lint changes.
      - name: Check changed Rust lines
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/test-check-rustfmt.py
          base="$FORMAT_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # Manual runs and first pushes have no event base; check this commit.
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check-rustfmt.py --base "$base"

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust Clippy (${{ matrix.shell }})
    # Without this the job inherits GitHub's 6-hour default. A flaky Ubuntu mirror
    # hung `apt-get update` here for 34 minutes with no compiler ever reached, and
    # because the job never ended the whole run stayed in progress - which also
    # blocks `gh run rerun --failed` on the jobs that DID fail. 30 bounds this
    # cold compilation job; cross-platform-rust also needs time to run tests.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: headless
            features: search-static,test-support
            packages: ""
          - shell: desktop
            features: search-static,test-support,desktop
            packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
          - shell: gtk
            features: search-static,test-support,gtk-desktop
            packages: libgtk-4-dev libadwaita-1-dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: clippy

      # Each shell is linted with its test fixtures and all targets.
      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential libssl-dev pkg-config libdbus-1-dev ${{ matrix.packages }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-clippy-${{ matrix.shell }}
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}

      # Bump this job's toolchain only after reviewing new lints and running
      # all three Clippy feature sets with -D warnings on devbox; other build jobs stay on stable.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features ${{ matrix.features }} --all-targets -- -D warnings

  build-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Linux build + test (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            targets: --lib --bins
          - group: integration
            targets: --test '*'
    # Same gap as clippy above, and this one feeds the required merge gate, so a
    # hang here stalls every PR rather than one advisory check. Higher than the
    # rest because this job does strictly the most: frontend build and tests,
    # Rust tests, the headless gateway build and its smoke test. The number is a
    # hang backstop, not a target - a cold run is well under it.
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        # Same set as the release workflow: WebKitGTK + the Secret Service
        # (libdbus) deps the Tauri lib needs to compile on Linux.
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev dbus-daemon

      - name: Give the runner headroom (a cold build links WebKitGTK)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo fallocate -l 8G /mnt/ci-swap && sudo chmod 600 /mnt/ci-swap && sudo mkswap /mnt/ci-swap && sudo swapon /mnt/ci-swap || true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.151

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-desktop
          cache-bin: "false"
          save-if: ${{ matrix.group == 'integration' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}
      - run: npm ci
      - name: Build frontend assets for the desktop Rust tests
        run: npm run build

      # Core covers library/binary unit tests; the wildcard covers every
      # integration target, including future ones. Cargo --tests includes unit
      # targets too, so use --test '*' to keep the groups disjoint.
      - name: Rust tests (${{ matrix.group }})
        # Notification fixtures register a mock endpoint on this private bus.
        run: dbus-run-session -- cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci --features test-support,search-static ${{ matrix.targets }}

      - name: Build headless gateway for smoke tests
        if: matrix.group == 'integration'
        run: npm run build:gateway

      - name: Headless gateway security smoke
        if: matrix.group == 'integration'
        run: npm run smoke:headless

  chaos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Chaos suite (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential libssl-dev pkg-config libdbus-1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-chaos
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}

      # Run only the five chaos integration targets in this dedicated job.
      - name: Chaos suite
        run: |
          for test in chaos_concurrency chaos_env_allowlist chaos_faulty_servers chaos_process_kill chaos_registry; do
            cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static --test "$test"
          done

  cross-platform-rust:
    # Waits for the cheap Linux gates so a push that fails them never takes a
    # macOS or Windows runner. The matrix comes from ci-policy.mjs headlessMatrix:
    # drafts get the two Linux entries only.
    needs: [changes, frontend, clippy, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    name: Headless Rust tests (${{ matrix.os }}, ${{ matrix.group }})
    # Hang backstops, not targets. Linux and Windows run core and integration
    # as separate jobs; 35 minutes keeps cold compilation margin for each.
    # macOS runs both groups in one job to need one runner and one compile of
    # the shared library. Over 25 recent green runs the split macOS jobs took
    # 6 to 14 minutes (core) and 9 to 23 (integration), summing to 20 to 35
    # (median 24) including two setups. Dropping one setup and one compile of
    # the shared library, the combined job should take about 22, and about 32
    # on the slowest run seen (integration compile 7.8 minutes). Before
    # nextest, the single macOS job ran 27 minutes and once hit 30:10 (a35863c7).
    # 45 keeps that cold-compile margin on the one job doing both groups.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 35 }}
    env:
      TOOLPORT_TEST_FAILURE_LOG_DIR: ${{ github.workspace }}/.verify/one-gateway-failures
    strategy:
      fail-fast: false
      matrix:
        # Groups: core is --lib --bins, integration is --test '*', all is both.
        include: ${{ fromJSON(needs.changes.outputs.headless_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The signature tests compile their output with the repository's tsc and
      # fail in CI when it is missing.
      - name: Install frontend dependencies for the signature compile checks
        if: matrix.group != 'integration'
        run: npm ci

      # BGE uses Candle CPU on all release targets. No ONNX Runtime shared
      # library or execution-provider package is needed for search-static.
      # The headless build skips Tauri/WebKit, but the Linux keyring backend still
      # needs libdbus headers and pkg-config at compile time.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential libssl-dev pkg-config libdbus-1-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.151

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-headless
          cache-bin: "false"
          # Only one group per OS saves the shared dependency cache, after desktop checks.
          save-if: ${{ matrix.group != 'core' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}
      - name: Compile Rust tests and record build timings
        if: matrix.os != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static ${{ matrix.targets }} --no-run --timings

      - name: Compile Windows Rust tests and record build timings
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/test-rust-windows.ps1 -NoDefaultFeatures -TestGroup ${{ matrix.group }} -BuildOnly

      - name: Rust tests (${{ matrix.group }}, no desktop)
        if: matrix.os != 'windows-latest'
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci --no-default-features --features test-support,search-static ${{ matrix.targets }}

      # Reuse the local Windows helper so a stale debug gateway cannot lock the
      # executable while Cargo rebuilds it.
      - name: Rust tests (Windows, no desktop)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/test-rust-windows.ps1 -NoDefaultFeatures -TestGroup ${{ matrix.group }} -Nextest

      - name: Build headless gateway for cross-platform smoke
        if: matrix.os != 'ubuntu-22.04' && matrix.group != 'core'
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin toolport-gateway --bin mock-mcp-server --no-default-features --features test-support,search-static

      - name: Headless gateway security smoke (macOS)
        if: matrix.os == 'macos-latest' && matrix.group != 'core'
        run: node scripts/smoke-headless.mjs

      # Report only: what starting the daemon on demand costs the first call.
      - name: First tool call with and without a running daemon (macOS, debug build)
        if: matrix.os == 'macos-latest' && matrix.group != 'core'
        continue-on-error: true
        env:
          TOOLPORT_BENCH_PROFILE: debug
        run: node benchmark/cold-start.mjs 20

      - name: Headless gateway security smoke (Windows)
        if: matrix.os == 'windows-latest' && matrix.group == 'integration'
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-headless.ps1

      # Approval OS toasts use desktop-only APIs. Headless checks cannot compile
      # the Windows/macOS notification branches.
      # macOS (group all) already installed them for the signature checks.
      - name: Install frontend dependencies for desktop approval checks
        if: matrix.os == 'windows-latest' && matrix.group == 'integration'
        run: npm ci

      - name: Build frontend assets for desktop approval checks
        if: matrix.os != 'ubuntu-22.04' && matrix.group != 'core'
        run: npm run build

      - name: Compile desktop approval notifications (Windows and macOS)
        if: matrix.os != 'ubuntu-22.04' && matrix.group != 'core'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib

      # scripts/install.ps1 is piped into `iex` from a pinned commit, so a
      # regression in asset selection, checksum enforcement, or the silent-install
      # flag reaches users with no build step in between. Nothing else in CI runs
      # it. Its own job because it needs neither Rust nor Node (SBS-713).
      - name: Save failed gateway conformance logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-gateway-failures-${{ matrix.os }}-${{ matrix.group }}
          path: .verify/one-gateway-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Rust compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-build-timings-${{ matrix.os }}-${{ matrix.group }}
          path: |
            src-tauri/target/cargo-timings/*.html
            src-tauri/target/nextest/ci/junit.xml
            .verify/client-conformance-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  installer-script:
    name: Installer script tests
    needs: [changes, frontend, clippy, rustfmt]
    # A Windows runner: same rule as the bundle validations above, minus the
    # installer selection (this job always ran).
    if: >-
      ${{ !cancelled() && needs.changes.outputs.full == 'true' &&
      needs.frontend.result == 'success' &&
      (needs.changes.outputs.rust == 'false' ||
      (needs.clippy.result == 'success' && needs.rustfmt.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # windows-latest ships Pester 5, but pin the major here so a runner-image
      # change cannot silently move the test framework under these tests.
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester |
                Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 `
              -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Pester tests for scripts/install.ps1
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $result = Invoke-Pester -Path scripts/install.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  # scripts/install.sh is the same shape: piped into `bash` from a pinned
  # commit on macOS and Linux, and its download verification (https-only,
  # per-asset digest, size/truncation, empty-file rejection) had no CI
  # coverage while the bash suite sat unrun (SBS-902). The harness shims curl,
  # uname and pacman-key on PATH and runs inside a temp HOME, so it needs no
  # root and touches nothing outside its scratch dirs.
  installer-script-bash:
    name: Installer script tests (bash)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Bash tests for scripts/install.sh
        run: bash scripts/install.Tests.bash

      - name: Bash tests for scripts/toolport-preview-rollback.sh
        run: bash scripts/toolport-preview-rollback.Tests.bash

  # SBS-894: toolport.app/install.sh and /install.ps1 redirect to a PINNED
  # COMMIT of those scripts, because they are piped into a shell and a movable
  # URL there means anything that lands on main runs on users' machines. Both
  # scripts' wrong-OS hints used to send the user to
  # raw.githubusercontent.com/<repo>/main/scripts/..., routing straight around
  # that control. The policy lived only in a comment, so it regressed the moment
  # someone wrote a helpful hint. This makes it a check.
  pinned-install-urls:
    name: Pinned installer URLs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: No file may point at an unpinned installer path
        run: |
          # Every MOVABLE ref, not just `main`: raw.githubusercontent serves
          # HEAD and master the same way, so pinning only one spelling leaves
          # the same hole one word away. The trailing `scripts/` keeps this to
          # the piped-into-a-shell files rather than any link into the repo.
          #
          # This file is excluded because the pattern below is itself an
          # occurrence, and nothing here is piped into a user's shell.
          matches="$(git grep -nE -- '(main|master|HEAD)/scripts/' -- ':!.github/workflows/ci.yml' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo
            echo "The lines above point at an unpinned installer path."
            echo "toolport.app/install.* redirects to a PINNED COMMIT because those"
            echo "scripts are piped into a shell; a movable ref routes around that."
            echo "Use https://toolport.app/install.sh and /install.ps1 (SBS-894)."
            exit 1
          fi

  # SBS-874: branch protection required contexts are only the check named
  # "Build + test". That name used to belong to the Linux-only job, so a red
  # Windows keyring run (Headless Rust tests (windows-latest)) or a red
  # install.ps1 Pester job could not block merge. This job keeps the required
  # name and requires all selected checks. Only unchanged native jobs on a
  # frontend-only PR may skip; failures, cancellations and unexpected skips
  # block the gate. Clippy and changed-line Rust formatting are also required.
  # A draft PR skips the macOS, Windows and installer jobs, so its gate always
  # fails with a message saying so: a skipped or green gate would satisfy branch
  # protection on that SHA until the ready-for-review run replaced it. Adding job names as
  # separate required contexts still needs a GitHub settings click; this file
  # cannot do that.
  merge-gate:
    name: Build + test
    if: always()
    needs:
      - changes
      - frontend
      - clippy
      - rustfmt
      - build-test
      - cross-platform-rust
      - linux-native
      - linux-packages
      - windows-installer
      - macos-payload
      - linux-appimage
      - chaos
      - installer-script
      - installer-script-bash
      - pinned-install-urls
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require all selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-policy.mjs gate
