name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (checkout, build, test). No writes.
permissions:
  contents: read

jobs:
  linux-native:
    name: Linux-native GTK preview
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # The native shell deliberately skips WebKit/Tauri. Ubuntu 24.04 provides
      # GTK >= 4.10 and libadwaita >= 1.4, the floor for adaptive navigation.
      - name: Install GTK build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-gtk-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gtk-cargo-

      - name: Build the opt-in native preview
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features gtk-desktop --bin toolport-gtk

      - name: Test the native shell module
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          --features gtk-desktop --lib linux_native::

  clippy:
    name: Rust Clippy
    # Without this the job inherits GitHub's 6-hour default. A flaky Ubuntu mirror
    # hung `apt-get update` here for 34 minutes with no compiler ever reached, and
    # because the job never ended the whole run stayed in progress - which also
    # blocks `gh run rerun --failed` on the jobs that DID fail. 30 matches
    # cross-platform-rust, the other job that compiles this crate from cold.
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      # Same headless dependency set as build-test: no GTK/WebKit, because the
      # lint below skips the Tauri desktop feature for the same reason.
      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev

      # --no-default-features matches every other Rust job here. With the desktop
      # feature on, this needs the GTK and WebKit headers and dies building gdk-sys.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --lib --bins

  build-test:
    name: Linux build + test
    # Same gap as clippy above, and this one feeds the required merge gate, so a
    # hang here stalls every PR rather than one advisory check. Higher than the
    # rest because this job does strictly the most: frontend build and tests,
    # Rust tests, the headless gateway build and its smoke test. The number is a
    # hang backstop, not a target - a cold run is well under it.
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        # Same set as the release workflow: WebKitGTK + the Secret Service
        # (libdbus) deps the Tauri lib needs to compile on Linux.
        run: scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev

      - name: Give the runner headroom (a cold build links WebKitGTK)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo fallocate -l 8G /mnt/ci-swap && sudo chmod 600 /mnt/ci-swap && sudo mkswap /mnt/ci-swap && sudo swapon /mnt/ci-swap || true

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      # Enforce consistent formatting before anything else — fails fast on
      # formatting-only issues so the contributor doesn't wait for a full build.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Frontend type-check + build (`build` is `tsc && vite build`). Also produces
      # dist/, which tauri-build expects when compiling the Rust crate below.
      - name: Frontend type-check + build
        run: npm run build

      - name: Frontend tests
        run: npm run test

      # Run the library, standalone binary, and integration targets explicitly.
      # Keeping all three flags prevents any test class from silently dropping
      # out of CI when the command is updated.
      - name: Rust tests (lib + binaries + integration)
        run: npm run test:rust

      - name: Build headless gateway for smoke tests
        run: npm run build:gateway

      - name: Headless gateway security smoke
        run: npm run smoke:headless

  cross-platform-rust:
    name: Headless Rust tests (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.os != 'ubuntu-22.04'
        with:
          node-version: 20

      # The headless build skips Tauri/WebKit, but the Linux keyring backend still
      # needs libdbus headers and pkg-config at compile time.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-headless-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-headless-cargo-

      - name: Rust tests (lib + binaries + integration, no desktop)
        if: matrix.os != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --bins --tests

      # Reuse the local Windows helper so a stale debug gateway cannot lock the
      # executable while Cargo rebuilds it.
      - name: Rust tests (Windows, no desktop)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/test-rust-windows.ps1 -NoDefaultFeatures

      - name: Build headless gateway for cross-platform smoke
        if: matrix.os != 'ubuntu-22.04'
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin toolport-gateway --bin mock-mcp-server --no-default-features

      - name: Headless gateway security smoke (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-headless.mjs

      - name: Headless gateway security smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-headless.ps1

  # scripts/install.ps1 is piped into `iex` from a pinned commit, so a
  # regression in asset selection, checksum enforcement, or the silent-install
  # flag reaches users with no build step in between. Nothing else in CI runs
  # it. Its own job because it needs neither Rust nor Node (SBS-713).
  installer-script:
    name: Installer script tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # windows-latest ships Pester 5, but pin the major here so a runner-image
      # change cannot silently move the test framework under these tests.
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester |
                Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 `
              -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Pester tests for scripts/install.ps1
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $result = Invoke-Pester -Path scripts/install.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  # SBS-894: toolport.app/install.sh and /install.ps1 redirect to a PINNED
  # COMMIT of those scripts, because they are piped into a shell and a movable
  # URL there means anything that lands on main runs on users' machines. Both
  # scripts' wrong-OS hints used to send the user to
  # raw.githubusercontent.com/<repo>/main/scripts/..., routing straight around
  # that control. The policy lived only in a comment, so it regressed the moment
  # someone wrote a helpful hint. This makes it a check.
  pinned-install-urls:
    name: Pinned installer URLs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: No file may point at an unpinned installer path
        run: |
          # Every MOVABLE ref, not just `main`: raw.githubusercontent serves
          # HEAD and master the same way, so pinning only one spelling leaves
          # the same hole one word away. The trailing `scripts/` keeps this to
          # the piped-into-a-shell files rather than any link into the repo.
          #
          # This file is excluded because the pattern below is itself an
          # occurrence, and nothing here is piped into a user's shell.
          matches="$(git grep -nE -- '(main|master|HEAD)/scripts/' -- ':!.github/workflows/ci.yml' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo
            echo "The lines above point at an unpinned installer path."
            echo "toolport.app/install.* redirects to a PINNED COMMIT because those"
            echo "scripts are piped into a shell; a movable ref routes around that."
            echo "Use https://toolport.app/install.sh and /install.ps1 (SBS-894)."
            exit 1
          fi

  # SBS-874: branch protection required contexts are only the check named
  # "Build + test". That name used to belong to the Linux-only job, so a red
  # Windows keyring run (Headless Rust tests (windows-latest)) or a red
  # install.ps1 Pester job could not block merge. This job keeps the required
  # name and fails unless every job that must gate merge succeeded. A skipped
  # or cancelled dependency must not count as success (`if: always()` plus
  # explicit result checks). Clippy stays out of this gate (non-blocking
  # until existing warnings are cleared). Adding the individual job names as
  # separate required contexts still needs a GitHub settings click; this file
  # cannot do that.
  merge-gate:
    name: Build + test
    if: always()
    needs:
      - build-test
      - cross-platform-rust
      - installer-script
      - pinned-install-urls
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require Linux, Windows/macOS headless, install.ps1 and pinned URLs
        run: |
          echo "build-test=${{ needs.build-test.result }}"
          echo "cross-platform-rust=${{ needs.cross-platform-rust.result }}"
          echo "installer-script=${{ needs.installer-script.result }}"
          echo "pinned-install-urls=${{ needs.pinned-install-urls.result }}"
          test "${{ needs.build-test.result }}" = "success"
          test "${{ needs.cross-platform-rust.result }}" = "success"
          test "${{ needs.installer-script.result }}" = "success"
          test "${{ needs.pinned-install-urls.result }}" = "success"
