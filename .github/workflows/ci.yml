name: CI

on:
  pull_request:
  push:
    branches: [main, next/2.0]
  workflow_dispatch:

# A new push to a PR cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (checkout, build, test). No writes.
permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS bundle validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          cache-bin: "false"
          save-if: false
      - run: npm ci
      # Same bundle command as Release; artifacts stay in CI and are not published.
      - name: Build the real NSIS installer
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --bundles nsis -- --bin conduit
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check shipped contents
        shell: bash
        run: node .github/scripts/package-contents.mjs src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Exercise the real installer and uninstaller
        shell: pwsh
        run: python scripts/test-windows-installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-nsis-validation
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe*
            .verify/windows-installer/**
          if-no-files-found: error
          retention-days: 7

  linux-packages:
    name: GTK deb and rpm install tests
    needs: changes
    if: needs.changes.outputs.linux_packages == 'true'
    uses: ./.github/workflows/linux-packages.yml

  changes:
    name: Select checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      linux_packages: ${{ steps.select.outputs.linux_packages }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test check selection and required gate
        run: node --test .github/scripts/ci-policy.test.mjs .github/scripts/gateway-build-features.test.mjs
      - name: Select changed native checks
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-policy.mjs select

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Release publication and payload fixtures
        run: node --test .github/scripts/release-hygiene.test.mjs

      - name: Production dependency audit
        run: npm run audit:prod

      # Enforce consistent formatting before anything else — fails fast on
      # formatting-only issues so the contributor doesn't wait for a full build.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Frontend type-check + build (`build` is `tsc && vite build`). Also produces
      # dist/, which tauri-build expects when compiling the Rust crate below.
      - name: Frontend type-check + build
        run: npm run build

      - name: Frontend tests
        run: npm run test

      - name: Startup bundle budget
        run: npm run bench:bundle

      - name: Install browser for offline UI smoke
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Offline browser fixture smoke
        run: npm run smoke:browser

      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-diagnostics
          path: .verify/browser-*/
          include-hidden-files: true
          if-no-files-found: ignore

  linux-native:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Linux-native GTK preview
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # The native shell deliberately skips WebKit/Tauri. Ubuntu 24.04 provides
      # GTK >= 4.10 and libadwaita >= 1.4, the floor for adaptive navigation.
      - name: Install GTK build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev xvfb xauth dbus-daemon

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-gtk
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the native GTK shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features gtk-desktop --bin toolport-gtk

      - name: Test the native shell module
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          --features gtk-desktop --lib linux_native::

      - name: Test Teams dialogs in isolated processes
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          for case in \
            member_review_native_shows_diff_labels_and_both_decisions \
            member_review_native_keeps_remaining_decisions_open \
            share_preview_explains_each_selection_and_its_route \
            share_preview_widgets_show_allowlisted_definitions
          do
            xvfb-run -a dbus-run-session -- cargo test \
              --manifest-path src-tauri/Cargo.toml --no-default-features \
              --features gtk-desktop --lib "linux_native::teams::tests::$case" \
              -- --exact --ignored
          done

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust Clippy
    # Without this the job inherits GitHub's 6-hour default. A flaky Ubuntu mirror
    # hung `apt-get update` here for 34 minutes with no compiler ever reached, and
    # because the job never ended the whole run stayed in progress - which also
    # blocks `gh run rerun --failed` on the jobs that DID fail. 30 matches
    # cross-platform-rust, the other job that compiles this crate from cold.
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      # Same headless dependency set as build-test: no GTK/WebKit, because the
      # lint below skips the Tauri desktop feature for the same reason.
      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev

      # --no-default-features matches every other Rust job here. With the desktop
      # feature on, this needs the GTK and WebKit headers and dies building gdk-sys.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-clippy
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features search-static --lib --bins

  build-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Linux build + test
    # Same gap as clippy above, and this one feeds the required merge gate, so a
    # hang here stalls every PR rather than one advisory check. Higher than the
    # rest because this job does strictly the most: frontend build and tests,
    # Rust tests, the headless gateway build and its smoke test. The number is a
    # hang backstop, not a target - a cold run is well under it.
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        # Same set as the release workflow: WebKitGTK + the Secret Service
        # (libdbus) deps the Tauri lib needs to compile on Linux.
        run: scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev

      - name: Give the runner headroom (a cold build links WebKitGTK)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          sudo fallocate -l 8G /mnt/ci-swap && sudo chmod 600 /mnt/ci-swap && sudo mkswap /mnt/ci-swap && sudo swapon /mnt/ci-swap || true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-desktop
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build frontend assets for the desktop Rust tests
        run: npm run build

      # Run the library, standalone binary, and integration targets explicitly.
      # Keeping all three flags prevents any test class from silently dropping
      # out of CI when the command is updated.
      - name: Rust tests (lib + binaries + integration)
        run: npm run test:rust

      - name: Build headless gateway for smoke tests
        run: npm run build:gateway

      - name: Headless gateway security smoke
        run: npm run smoke:headless

  chaos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Chaos suite (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-chaos
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The chaos cases are separate integration binaries; `cargo test` has no
      # glob for `--test`, so run each one explicitly.
      - name: Chaos suite
        run: |
          for test in chaos_concurrency chaos_env_allowlist chaos_faulty_servers chaos_process_kill chaos_registry; do
            cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static --test "$test"
          done

  cross-platform-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Headless Rust tests (${{ matrix.os }})
    timeout-minutes: 30
    env:
      TOOLPORT_TEST_FAILURE_LOG_DIR: ${{ github.workspace }}/.verify/one-gateway-failures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.os != 'ubuntu-22.04'
        with:
          node-version: 20

      # The headless build skips Tauri/WebKit, but the Linux keyring backend still
      # needs libdbus headers and pkg-config at compile time.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: scripts/ci-apt-install.sh build-essential libssl-dev pkg-config libdbus-1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ci-headless
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next/2.0') }}
      - name: Compile Rust tests and record build timings
        if: matrix.os != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static --lib --bins --tests --no-run --timings

      - name: Compile Windows Rust tests and record build timings
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/test-rust-windows.ps1 -NoDefaultFeatures -BuildOnly

      - name: Rust tests (lib + binaries + integration, no desktop)
        if: matrix.os != 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static --lib --bins --tests

      # Reuse the local Windows helper so a stale debug gateway cannot lock the
      # executable while Cargo rebuilds it.
      - name: Rust tests (Windows, no desktop)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/test-rust-windows.ps1 -NoDefaultFeatures

      - name: Build headless gateway for cross-platform smoke
        if: matrix.os != 'ubuntu-22.04'
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin toolport-gateway --bin mock-mcp-server --no-default-features --features test-support,search-static

      - name: Headless gateway security smoke (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-headless.mjs

      - name: Headless gateway security smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-headless.ps1

      # Approval OS toasts use desktop-only APIs. Headless checks cannot compile
      # the Windows/macOS notification branches.
      - name: Install frontend dependencies for desktop approval checks
        if: matrix.os != 'ubuntu-22.04'
        run: npm ci

      - name: Build frontend assets for desktop approval checks
        if: matrix.os != 'ubuntu-22.04'
        run: npm run build

      - name: Compile desktop approval notifications (Windows and macOS)
        if: matrix.os != 'ubuntu-22.04'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib

      # scripts/install.ps1 is piped into `iex` from a pinned commit, so a
      # regression in asset selection, checksum enforcement, or the silent-install
      # flag reaches users with no build step in between. Nothing else in CI runs
      # it. Its own job because it needs neither Rust nor Node (SBS-713).
      - name: Save failed gateway conformance logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-gateway-failures-${{ matrix.os }}
          path: .verify/one-gateway-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Rust compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-build-timings-${{ matrix.os }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  installer-script:
    name: Installer script tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # windows-latest ships Pester 5, but pin the major here so a runner-image
      # change cannot silently move the test framework under these tests.
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester |
                Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 `
              -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Pester tests for scripts/install.ps1
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $result = Invoke-Pester -Path scripts/install.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  # scripts/install.sh is the same shape: piped into `bash` from a pinned
  # commit on macOS and Linux, and its download verification (https-only,
  # per-asset digest, size/truncation, empty-file rejection) had no CI
  # coverage while the bash suite sat unrun (SBS-902). The harness shims curl,
  # uname and pacman-key on PATH and runs inside a temp HOME, so it needs no
  # root and touches nothing outside its scratch dirs.
  installer-script-bash:
    name: Installer script tests (bash)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Bash tests for scripts/install.sh
        run: bash scripts/install.Tests.bash

      - name: Bash tests for scripts/toolport-preview-rollback.sh
        run: bash scripts/toolport-preview-rollback.Tests.bash

  # SBS-894: toolport.app/install.sh and /install.ps1 redirect to a PINNED
  # COMMIT of those scripts, because they are piped into a shell and a movable
  # URL there means anything that lands on main runs on users' machines. Both
  # scripts' wrong-OS hints used to send the user to
  # raw.githubusercontent.com/<repo>/main/scripts/..., routing straight around
  # that control. The policy lived only in a comment, so it regressed the moment
  # someone wrote a helpful hint. This makes it a check.
  pinned-install-urls:
    name: Pinned installer URLs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: No file may point at an unpinned installer path
        run: |
          # Every MOVABLE ref, not just `main`: raw.githubusercontent serves
          # HEAD and master the same way, so pinning only one spelling leaves
          # the same hole one word away. The trailing `scripts/` keeps this to
          # the piped-into-a-shell files rather than any link into the repo.
          #
          # This file is excluded because the pattern below is itself an
          # occurrence, and nothing here is piped into a user's shell.
          matches="$(git grep -nE -- '(main|master|HEAD)/scripts/' -- ':!.github/workflows/ci.yml' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo
            echo "The lines above point at an unpinned installer path."
            echo "toolport.app/install.* redirects to a PINNED COMMIT because those"
            echo "scripts are piped into a shell; a movable ref routes around that."
            echo "Use https://toolport.app/install.sh and /install.ps1 (SBS-894)."
            exit 1
          fi

  # SBS-874: branch protection required contexts are only the check named
  # "Build + test". That name used to belong to the Linux-only job, so a red
  # Windows keyring run (Headless Rust tests (windows-latest)) or a red
  # install.ps1 Pester job could not block merge. This job keeps the required
  # name and requires all selected checks. Only unchanged native jobs on a
  # frontend-only PR may skip; failures, cancellations and unexpected skips
  # block the gate. Clippy stays out of this gate (non-blocking
  # until existing warnings are cleared). Adding the individual job names as
  # separate required contexts still needs a GitHub settings click; this file
  # cannot do that.
  merge-gate:
    name: Build + test
    if: always()
    needs:
      - changes
      - frontend
      - build-test
      - cross-platform-rust
      - linux-native
      - linux-packages
      - chaos
      - installer-script
      - installer-script-bash
      - pinned-install-urls
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Require all selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-policy.mjs gate
