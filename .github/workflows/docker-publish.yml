name: Publish gateway image

# Builds toolport-gateway with cached Rust on the host, then packages a slim
# runtime image to GHCR. Avoids compiling Tauri/WebKit inside Docker (~9 min).

on:
  push:
    branches: [main]
    tags: ["v*"]
  # On PRs, only when the image or the gateway binary can change. The binary
  # reads src-tauri/** and, at compile time, src/locales/** (i18n.rs). Every
  # other include outside src-tauri is in a cfg(test) module that these release
  # builds never compile, and linux_native needs the gtk-desktop feature, which
  # they never enable. Push to main, tags and dispatch always run.
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "!src-tauri/src/linux_native/**"
      - "src/locales/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "scripts/ci-apt-install.sh"
      - ".github/actions/apt-install/**"
  workflow_dispatch:
    inputs:
      registry_tag:
        description: "List an existing release tag (vX.Y.Z) on the MCP registry without rebuilding the image"
        required: false
        default: ""

concurrency:
  # A registry-only dispatch gets its own group so it never cancels an image build.
  group: docker-gateway-${{ github.ref }}${{ inputs.registry_tag && format('-registry-{0}', inputs.registry_tag) || '' }}
  cancel-in-progress: true

# Least privilege at the top level: read-only. Only the publish job below is
# granted packages:write (GHCR push); the build-gateway job just compiles and
# uploads an artifact, so it needs no write scope.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/btsouth/toolport-gateway

jobs:
  build-gateway:
    # Backstop only - GitHub defaults to 360 minutes. Matches the Rust jobs in ci.yml: this compiles the same crate from a cold cache.
    timeout-minutes: 30
    name: build gateway binary
    # A registry-only dispatch lists an image that already exists.
    if: ${{ !inputs.registry_tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential libssl-dev pkg-config libdbus-1-dev

      # Cache DEPENDENCY build artifacts only, never the workspace's own crates.
      # History: a naive actions/cache of all of `src-tauri/target` keyed on Cargo.lock
      # once served a stale local-crate compile that cargo trusted (the crate recompiled 0
      # times), so v0.3.12/v0.3.13 shipped signed binaries missing a command. docker-publish
      # still used that shape (SBS-926): a source change that did not touch the lockfile
      # could restore `src-tauri/target` and upload a stale toolport-gateway to GHCR.
      # Swatinem/rust-cache is the same class of fix as release.yml: before saving it
      # evicts workspace members (the crate + bins) from the cache, so they ALWAYS
      # recompile from the current commit, while third-party deps are restored. Do NOT
      # replace this with a plain actions/cache of `target/`. `key` isolates this job
      # from release.yml's Linux rust-cache (empty matrix.target), which builds a
      # different feature set. cache-bin: false keeps ~/.cargo/bin (which rust-cache
      # caches by default) out of this cache; cargo-auditable is reinstalled each run.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: docker-gateway
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Binary tests link the library without the library's `cfg(test)`, so
      # release-profile tests need the test-support hooks. Rebuild without the
      # feature afterwards so the uploaded artifact is a production binary.
      - name: Test toolport-gateway
        run: cargo test --release --bin toolport-gateway --manifest-path src-tauri/Cargo.toml --no-default-features --features test-support,search-static

      # cargo auditable embeds the crate list in the binary so image scanners
      # (Trivy, Grype, cargo audit bin) can see the Rust dependencies in GHCR.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.7

      - name: Rebuild production gateway binary
        run: cargo auditable build --release --locked --bin toolport-gateway --manifest-path src-tauri/Cargo.toml --no-default-features --features search-static

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolport-gateway-bin
          path: src-tauri/target/release/toolport-gateway
          retention-days: 1

  publish:
    # Backstop only - GitHub defaults to 360 minutes. Multi-arch buildx and a registry push, both network-bound.
    timeout-minutes: 30
    name: build + push image
    needs: build-gateway
    # A preview tag such as v2.0.0-preview.1 must never publish an image (and so
    # can never publish `latest`). Release tags stay plain vX.Y.Z, so any tag name
    # with a prerelease suffix skips the publish job; PR builds and main pushes
    # are unchanged. The build job still runs for every trigger.
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: toolport-gateway-bin
          path: artifact

      - name: Stage binary for Dockerfile
        run: cp artifact/toolport-gateway toolport-gateway-bin && chmod 755 toolport-gateway-bin

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # INST-08: `latest` tracks a published release, never main. A push to
            # the default branch publishes `edge` (unreleased tip), and only a tag
            # push can set `latest`. The publish job's `if` above already drops
            # prerelease tags, so `latest` is a plain vX.Y.Z release only.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Lists each release on the official MCP registry (registry.modelcontextprotocol.io)
  # as io.github.btsouth/toolport. Nothing depends on this job, so a registry
  # outage or rejection never blocks the image or the rest of the release.
  # Runs only in btsouth/toolport (forks have no claim to the namespace), only for
  # plain vX.Y.Z tags whose image push succeeded, or by hand for an existing tag.
  publish-mcp-registry:
    # Backstop only - an image pull and three small registry calls.
    timeout-minutes: 15
    name: list on MCP registry
    needs: publish
    if: >-
      ${{ !cancelled() && github.repository == 'btsouth/toolport' && (
        (github.event_name == 'push' && github.ref_type == 'tag' &&
          !contains(github.ref_name, '-') && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.registry_tag != '')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    env:
      # Upgrade deliberately: bump the version and the archive digest together
      # (the digest is on the release page and in the GitHub asset metadata).
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
      RELEASE_TAG: ${{ inputs.registry_tag || github.ref_name }}
    steps:
      - name: Check the tag is a stable release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$RELEASE_TAG is not a vX.Y.Z release tag; only stable releases are listed."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # check-release-version.mjs already gates the release on this; repeat it
      # here so a hand-run against an older tag fails with a clear message.
      - name: Check server.json matches the tag
        run: |
          set -euo pipefail
          test -f server.json || { echo "::error::$RELEASE_TAG has no server.json"; exit 1; }
          version="$(jq -r .version server.json)"
          image="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          if [ "$version" != "${RELEASE_TAG#v}" ] || [ "$image" != "$IMAGE:$RELEASE_TAG" ]; then
            echo "::error::server.json has version $version and image $image, expected ${RELEASE_TAG#v} and $IMAGE:$RELEASE_TAG"
            exit 1
          fi

      # The registry verifies ownership of an OCI package by this image config
      # label, so check it before asking the registry to.
      - name: Check the pushed image carries the registry label
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE:$RELEASE_TAG"
          want="$(jq -r .name server.json)"
          got="$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')"
          if [ "$got" != "$want" ]; then
            echo "::error::$IMAGE:$RELEASE_TAG has io.modelcontextprotocol.server.name=\"$got\", expected \"$want\""
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir" && cd "$dir"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          echo "$dir" >> "$GITHUB_PATH"

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Log in to the MCP registry
        run: mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        run: mcp-publisher publish server.json
