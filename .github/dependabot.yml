# Dependabot config.
#
# Toolport does not run scheduled version updates: the Rust dependency set is
# dominated by the Tauri/gtk/wry stack, which has to move as one release train,
# so per-crate bump PRs are noise rather than signal. `open-pull-requests-limit:
# 0` keeps version updates off. Security updates are NOT subject to that limit
# and still run, which is the point - this file exists so the `ignore` below can
# apply to them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # GHSA-wrw7-89jp-8q8g - unsoundness in the `Iterator` and
      # `DoubleEndedIterator` impls for `glib::VariantStrIter`. Medium. Fixed in
      # glib 0.20.0.
      #
      # Not fixable from this repo, and not reachable from this code:
      #
      #   * glib is not a direct dependency. glib 0.18.5 is pinned by the
      #     gtk 0.18 / gdk 0.18 / gio 0.18 stack that Tauri 2.11 pulls in for
      #     the Linux backend. Nothing here can resolve to 0.20 while Tauri
      #     pins gtk 0.18, so every security-update run ended in
      #     `security_update_not_possible` and failed the workflow.
      #   * Toolport never calls glib directly and never constructs a
      #     `VariantStrIter`. The unsound iterators are not on any path we run.
      #
      # A permanently red job trains everyone to ignore red, so the attempt is
      # suppressed rather than the alert: GHSA-wrw7-89jp-8q8g stays open and
      # visible in the Security tab.
      #
      # REMOVE THIS ENTRY when Tauri 2.12 lands. It bumps the gtk stack past
      # this advisory, and it also carries the tao 0.36 fix that the Wayland
      # input-region workaround in `src-tauri/src/desktop.rs` is waiting on -
      # both go away in the same upgrade.
      #
      # `versions` matches the release Dependabot would update TO, not the
      # vulnerable range we are on. The security job targets the fix, 0.20.0,
      # so that is what has to be ignored - `"< 0.20.0"` would leave 0.20.0 a
      # valid candidate and the run would still fail. Listing the versions is
      # also required rather than optional here: under security-updates-only,
      # Dependabot consults these strings, so a name-only entry is ignored.
      - dependency-name: "glib"
        versions: [">= 0.20.0"]
