name: Install apt packages with a .deb cache
description: >
  Runs scripts/ci-apt-install.sh with the downloaded .deb files carried across
  runs, so a throttled mirror only has to serve what earlier runs did not get.
inputs:
  packages:
    description: Space-separated apt package names.
    required: true
runs:
  using: composite
  steps:
    # The key names the runner image and the package set. Restoring a cache from
    # another set or an older image is fine: the script hands apt only the debs
    # whose SHA256 matches the freshly updated index, and drops the rest.
    - name: Name the apt cache
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/apt-debs"
        set_hash=$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)
        {
          echo "dir=${dir}"
          echo "image=apt-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "os=apt-debs-${ImageOS:-unknown}-"
          echo "set=${set_hash}"
        } >>"$GITHUB_OUTPUT"

    - name: Restore cached apt downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.dir }}
        # Never an exact hit: saved keys end in a content hash, so the newest
        # cache for this set wins, then any for this image, then any for this OS.
        key: ${{ steps.key.outputs.image }}-${{ steps.key.outputs.set }}
        restore-keys: |
          ${{ steps.key.outputs.image }}-${{ steps.key.outputs.set }}-
          ${{ steps.key.outputs.image }}-
          ${{ steps.key.outputs.os }}

    # The manifest is the sorted sha256 of every cached deb. It decides whether
    # to save and names the saved cache, so a deb repaired under the same
    # filename still counts as a change.
    - name: Record the restored downloads
      shell: bash
      env:
        DIR: ${{ steps.key.outputs.dir }}
      # Best effort: the cache must never fail a build. Without a record of what
      # was restored there is nothing to compare against, so the save is skipped.
      run: |
        set -uo pipefail
        before="${RUNNER_TEMP}/apt-debs-before"
        if mkdir -p "$DIR" && (cd "$DIR" && find . -maxdepth 1 -type f -name '*.deb' -print0 | sort -z | xargs -0 -r sha256sum) >"$before"; then
          echo "restored $(wc -l <"$before") cached debs"
        else
          rm -f "$before"
          echo "::warning::could not record the restored apt cache; it will not be saved"
        fi

    - name: Install packages
      shell: bash
      env:
        TOOLPORT_APT_DEB_CACHE: ${{ steps.key.outputs.dir }}
        PACKAGES: ${{ inputs.packages }}
      # Word splitting is the point: PACKAGES is a list of package names.
      run: |
        # shellcheck disable=SC2086
        "${GITHUB_ACTION_PATH}/../../../scripts/ci-apt-install.sh" $PACKAGES

    # Runs after a failed install too, so the debs a throttled run did fetch are
    # kept and the next run resumes from them. Skipped when the manifest matches
    # what was restored, which keeps a warm cache from writing a copy of itself,
    # and when it is empty, so an empty snapshot never becomes the newest match
    # and shadows a warm one. Best effort like the upload itself: any failure
    # here skips the save and never fails the job.
    - name: Check for new downloads
      id: new
      if: always()
      shell: bash
      env:
        DIR: ${{ steps.key.outputs.dir }}
        PREFIX: ${{ steps.key.outputs.image }}-${{ steps.key.outputs.set }}
      run: |
        set -uo pipefail
        before="${RUNNER_TEMP}/apt-debs-before"
        after="${RUNNER_TEMP}/apt-debs-after"
        if [ ! -d "$DIR" ] || [ ! -f "$before" ]; then
          echo "no apt cache record; not saving"
          exit 0
        fi
        if ! (cd "$DIR" && find . -maxdepth 1 -type f -name '*.deb' -print0 | sort -z | xargs -0 -r sha256sum) >"$after"; then
          echo "::warning::could not hash the apt cache; not saving"
          exit 0
        fi
        if [ ! -s "$after" ]; then
          echo "cache empty; not saving"
        elif cmp -s "$before" "$after"; then
          echo "cache unchanged ($(wc -l <"$after") debs); not saving"
        elif key="${PREFIX}-$(sha256sum <"$after" | cut -c1-16)" && echo "key=${key}" >>"$GITHUB_OUTPUT"; then
          echo "cache changed ($(wc -l <"$after") debs); saving"
        else
          echo "::warning::could not name the apt cache; not saving"
        fi
        exit 0

    - name: Save apt downloads
      if: always() && steps.new.outputs.key != ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.new.outputs.key }}
