# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit).
# Read when `cargo audit` runs from this directory (where Cargo.lock lives).

[advisories]
ignore = [
    # glib VariantStrIter unsoundness. Linux-only, pulled in transitively by
    # Tauri's gtk-0.18 webview stack which hard-pins `glib = "^0.18"`; the fix
    # exists only in glib 0.20+, so it cannot be selected without moving the
    # whole webview stack. It is a soundness/null-deref crash (not RCE) in the
    # binding layer, not in Conduit code, and does not affect Windows or macOS.
    # Tracked in README "Known issues". Remove when Tauri's Linux stack adopts a
    # glib-0.20 base.
    "RUSTSEC-2024-0429",
    # zip extraction advisories (SUID/SGID bits kept, symlinks pointing outside
    # the destination, permissions applied through symlinks). All three are in
    # `ZipArchive::extract`. zip 4.6.1 comes from tauri-plugin-updater, which
    # calls `extract` only on Windows and only on a download whose minisign
    # signature already matched our updater key, so the archive is our own
    # release artifact. zip 8.6.0 comes from candle-core, which only reads
    # entries by name and never calls `extract`. The fix needs zip >=9, which
    # neither crate allows yet (updater requires ^4, candle ^8.6). Remove when
    # both move to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
