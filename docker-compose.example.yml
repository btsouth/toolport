# Example headless Toolport gateway. Copy to docker-compose.yml and fill .env.
#
# Option A — pull the published image (after GHCR package is public):
#   image: ghcr.io/btsouth/toolport-gateway:latest
# Option B — build locally:
#   build: .
#
# All TOOLPORT_* env names still accept pre-rename CONDUIT_* aliases.

services:
  toolport-gateway:
    build: .
    image: ghcr.io/btsouth/toolport-gateway:latest
    ports:
      - "8765:8765"
    volumes:
      # Recommended: a named volume. Docker seeds it from the image, where /data
      # is owned by the runtime user (uid 10001), so the gateway can write the
      # registry and its locks with no host chown.
      #
      # A host bind mount also works, but it must be owned by uid 10001 or the
      # gateway starts without loading the registry:
      #   mkdir -p data && sudo chown -R 10001:10001 data
      #   then replace the line below with: - ./data:/data
      - toolport-data:/data
    env_file:
      - .env
    environment:
      TOOLPORT_HTTP_HOST: "0.0.0.0"
      TOOLPORT_HTTP: "8765"
      TOOLPORT_REGISTRY: /data/registry.json
      # Required when binding 0.0.0.0 — set in .env:
      # TOOLPORT_HTTP_TOKEN=...
      # Optional encrypted vault passphrase (if using secrets.enc):
      # TOOLPORT_SECRET_KEY=...
      # Or inject per-server secrets directly:
      # TOOLPORT_SECRET_STRIPE_SECRET_KEY=sk_...
      # STRIPE_SECRET_KEY=sk_...  (requires TOOLPORT_ALLOW_BARE_SECRET_ENV below)
      TOOLPORT_ALLOW_BARE_SECRET_ENV: "1"
    restart: unless-stopped
    healthcheck:
      # Readiness, not just liveness: 200 once the registry loaded, 503 when the
      # gateway is serving the cached catalog only. Unauthenticated and data-free.
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:8765/healthz
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  toolport-data:
